name: Inspect IGNIX UI Source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-ignix-ui.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble decoded source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name 'source.part-*' | wc -l)" -eq 19
          cat source.part-{00..18} > source.zip
          unzip -q source.zip -d decoded
          ROOT="decoded/Zall RW_src"
          test -s "$ROOT/AndroidManifest.xml"

          mkdir -p report
          {
            echo "IGNIX SOURCE INSPECTION"
            echo "======================="
            echo
            echo "NAVIGATION CLASS"
            sed -n '1,260p' "$ROOT/smali/z/au.smali"
            echo
            echo "NAVIGATION RELATED CLASSES"
            for f in "$ROOT/smali/z/pc.smali" "$ROOT/smali/z/m40.smali" "$ROOT/smali/z/wn0.smali"; do
              if [ -f "$f" ]; then
                echo "===== $f ====="
                sed -n '1,260p' "$f"
              fi
            done
            echo
            echo "VIP DATA REFERENCES"
            grep -R -n -E 'activatedAt|vipUntil|isVip|ProgressIndicator|Permanent' "$ROOT/smali" "$ROOT/smali_classes2" 2>/dev/null | head -n 500 || true
            echo
            echo "REDEEM AND SCREEN REFERENCES"
            grep -R -n -E 'Redeem Code|Enter your VIP|Pilih Server|Pilih Rank|ServerBottomSheet|StartScreen' "$ROOT/smali" "$ROOT/smali_classes2" 2>/dev/null | head -n 300 || true
            echo
            echo "THEME AND COLOR REFERENCES"
            grep -R -n -E 'ColorScheme|darkColorScheme|lightColorScheme|MaterialTheme|#FF[0-9A-Fa-f]{6}' "$ROOT/smali" "$ROOT/smali_classes2" 2>/dev/null | head -n 400 || true
          } > report/ignix-ui-inspection.txt

          {
            echo "NAV ROUTE STRING AND NAV MODEL SEARCH"
            grep -R -n -E 'const-string[^,]*, "(home|profile|settings|features|redeem|Home|Profil|Fitur|Redeem)"|filled-new-array.*wn0|NavHost|NavigationBarItem' "$ROOT/smali" "$ROOT/smali_classes2" 2>/dev/null | head -n 700 || true
            echo
            echo "APP THEME ENTRYPOINT SEARCH"
            grep -R -n -E 'darkColorScheme|lightColorScheme|ColorSchemeKt|MaterialThemeKt|ThemeKt|0xFF[0-9A-Fa-f]{6}' "$ROOT/smali" "$ROOT/smali_classes2" 2>/dev/null | head -n 700 || true
            echo
            echo "VIP STATUS UI METHOD"
            if [ -f "$ROOT/smali/z/xl.smali" ]; then sed -n '3000,3650p' "$ROOT/smali/z/xl.smali"; fi
            echo
            echo "APP ENTRY AND ACTIVITY REFERENCES"
            grep -R -n -E 'MainActivity|StartScreen\(|NavigationBar|BottomNavigation|Scaffold' "$ROOT/smali" "$ROOT/smali_classes2" 2>/dev/null | head -n 500 || true
          } >> report/ignix-ui-inspection.txt

          {
            echo "NAVIGATION DATA BUILDER z/au"
            sed -n '560,900p' "$ROOT/smali/z/au.smali"
            echo
            echo "NAVIGATION CALLBACK z/c1"
            sed -n '1,900p' "$ROOT/smali/z/c1.smali"
            echo
            echo "NAVIGATION LAMBDA DISPATCH z/w5"
            sed -n '1,900p' "$ROOT/smali_classes2/z/w5.smali"
            echo
            echo "NAVIGATION SETTINGS LAMBDA z/cn0"
            sed -n '1,700p' "$ROOT/smali_classes2/z/cn0.smali"
            echo
            echo "ROUTE COMPOSABLE MAP z/pc and z/m40"
            for f in "$ROOT/smali/z/pc.smali" "$ROOT/smali/z/m40.smali"; do
              if [ -f "$f" ]; then sed -n '1,420p' "$f"; fi
            done
            echo
            echo "THEME COLOR SCHEME BUILDER z/au"
            sed -n '850,1035p' "$ROOT/smali/z/au.smali"
            echo
            echo "PROFILE AND REDEEM CONTAINER z/b4"
            sed -n '2200,2530p' "$ROOT/smali/z/b4.smali"
          } >> report/ignix-ui-inspection.txt
          cp "$ROOT/AndroidManifest.xml" report/
          cp "$ROOT/apktool.json" report/
          {
            echo "SCREEN COMPOSABLE TARGETS: tc, o51, j91, mu0"
            for cls in tc o51 j91 mu0; do
              f=$(find "$ROOT/smali" "$ROOT/smali_classes2" -type f -name "$cls.smali" -print -quit)
              if [ -n "$f" ]; then
                echo "===== $f ====="
                grep -n -E '^\.method|^\.end method|const-string.*(Settings|Profile|Redeem|Feature|VPN|Home|VIP|Server|Code|Pengaturan|Profil|Fitur)' "$f" | head -n 500 || true
                sed -n '1,2200p' "$f"
              fi
            done
            echo
            echo "REDEEM ROUTE CALLSITES"
            grep -R -n -E 'ServerBottomSheet|Redeem Code|RedeemCode|redeem' "$ROOT/smali" "$ROOT/smali_classes2" 2>/dev/null | head -n 700 || true
          } >> report/ignix-ui-inspection.txt
          {
            echo "ROOT NAV HOST AND NAV MODEL"
            for rel in "smali_classes2/z/en0.smali" "smali_classes2/z/an0.smali" "smali_classes2/z/un0.smali" "smali_classes2/z/rb.smali" "smali_classes2/z/wn0.smali"; do
              f="$ROOT/$rel"
              if [ -f "$f" ]; then
                echo "===== $rel ====="
                grep -n -E '^\\.method|^\\.end method|const-string.*(home|profile|settings|features|redeem|Home|Profil|Pengaturan|Fitur|Redeem)|filled-new-array|NavHost|NavigationBar' "$f" | head -n 600 || true
                sed -n '1,1800p' "$f"
              fi
            done
            echo
            echo "HOME FEATURE UI CONTEXT"
            grep -n -B 100 -A 260 'const-string.*"Fitur"' "$ROOT/smali_classes2/z/f91.smali" || true
            echo
            echo "FEATURE AND REDEEM COMPOSABLE METHOD SIGNATURES"
            for rel in "smali_classes2/z/f91.smali" "smali/z/b4.smali" "smali_classes2/z/tc.smali" "smali_classes2/z/o51.smali"; do
              f="$ROOT/$rel"
              if [ -f "$f" ]; then
                echo "===== $rel ====="
                grep -n -E '^\\.method|^\\.end method|const-string.*(Fitur|Redeem|Code|Server|Bypass|Damage|Enemy|Lock|Overlay|Smooth)' "$f" | head -n 700 || true
              fi
            done
          } >> report/ignix-ui-inspection.txt
          echo "Inspection report generated."
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: IGNIX-ui-inspection
          path: report/
          if-no-files-found: error
          retention-days: 7

# Refresh source inspection for the full IGNIX redesign.

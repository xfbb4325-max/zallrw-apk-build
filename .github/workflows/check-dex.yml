
name: Scan DrawScope References

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download original APK
        uses: actions/download-artifact@v4
        with:
          name: ZallRW-original
          path: original
          run-id: "42607124854"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Smali tools
        run: |
          set -e
          API="https://api.github.com/repos/baksmali/smali/releases/latest"
          RELEASE=$(curl -fsSL "$API")

          B=$(echo "$RELEASE" | jq -r '.assets[] | select(.name=="baksmali-3.0.10-fat-release.jar") | .browser_download_url')
          S=$(echo "$RELEASE" | jq -r '.assets[] | select(.name=="smali-3.0.10-fat-release.jar") | .browser_download_url')

          test -n "$B"
          test -n "$S"

          curl -fL --retry 3 -o baksmali.jar "$B"
          curl -fL --retry 3 -o smali.jar "$S"

      - name: Extract and disassemble
        run: |
          set -e
          mkdir -p original_dex report

          unzip -j original/ZallRW.apk 'classes*.dex' -d original_dex

          for dex in original_dex/classes*.dex; do
            name=$(basename "$dex" .dex)
            java -Xmx5g -jar baksmali.jar disassemble "$dex" -o "smali-$name"
          done

          java -Xmx5g -jar smali.jar assemble smali-classes2 -o rebuilt.dex
          java -Xmx5g -jar baksmali.jar disassemble rebuilt.dex -o smali-rebuilt

      - name: Scan all DrawScope references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          target = "Landroidx/compose/ui/graphics/drawscope/DrawScope;"
          roots = [
              Path("smali-classes"),
              Path("smali-classes2"),
              Path("smali-rebuilt")
          ]

          out = Path("report/drawscope-references.txt")
          out.parent.mkdir(exist_ok=True)

          with out.open("w") as report:
              for root in roots:
                  report.write(f"\n===== {root} =====\n")
                  if not root.exists():
                      report.write("Folder tidak ditemukan\n")
                      continue

                  count = 0
                  for file in root.rglob("*.smali"):
                      lines = file.read_text(errors="replace").splitlines()
                      matches = [
                          (i, line.strip())
                          for i, line in enumerate(lines, 1)
                          if target in line
                      ]

                      if matches:
                          for number, line in matches:
                              report.write(
                                  f"{file}:{number}: {line}\n"
                              )
                              count += 1

                  report.write(f"JUMLAH BARIS REFERENSI: {count}\n")

          print(out.read_text())
          PY

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-DRAWSCOPE-REFERENCES
          path: report/
          if-no-files-found: warn

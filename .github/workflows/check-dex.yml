name: Compare Compose Smali

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download original APK
        uses: actions/download-artifact@v4
        with:
          name: ZallRW-original
          path: original
          run-id: "42607124854"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Smali tools
        run: |
          set -e
          API="https://api.github.com/repos/baksmali/smali/releases/latest"
          RELEASE=$(curl -fsSL "$API")
          B=$(echo "$RELEASE" | jq -r '.assets[] | select(.name=="baksmali-3.0.10-fat-release.jar") | .browser_download_url')
          S=$(echo "$RELEASE" | jq -r '.assets[] | select(.name=="smali-3.0.10-fat-release.jar") | .browser_download_url')
          curl -fL --retry 3 -o baksmali.jar "$B"
          curl -fL --retry 3 -o smali.jar "$S"

      - name: Extract and rebuild DEX
        run: |
          set -e
          unzip -p original/ZallRW.apk classes2.dex > original.dex
          java -Xmx5g -jar baksmali.jar disassemble original.dex -o smali-original
          java -Xmx5g -jar smali.jar assemble smali-original -o rebuilt.dex
          java -Xmx5g -jar baksmali.jar disassemble rebuilt.dex -o smali-rebuilt

      - name: Compare Compose file contents
        run: |
          set -e
          mkdir -p report

          for f in \
            androidx/compose/ui/graphics/drawscope/DrawScope.smali \
            androidx/compose/ui/graphics/drawscope/DrawScope$DefaultImpls.smali \
            androidx/compose/ui/draw/CacheDrawScope.smali
          do
            name=$(basename "$f")
            if [ -f "smali-original/$f" ] && [ -f "smali-rebuilt/$f" ]; then
              diff -u "smali-original/$f" "smali-rebuilt/$f" \
                > "report/$name.diff" || true
              if [ -s "report/$name.diff" ]; then
                echo "$name: ADA PERBEDAAN"
              else
                echo "$name: IDENTIK"
              fi
            else
              echo "$name: FILE TIDAK DITEMUKAN"
            fi
          done

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-COMPOSE-DIFF
          path: report/
          if-no-files-found: warn

name: Check Original DEX Rebuild

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download original APK
        uses: actions/download-artifact@v4
        with:
          name: ZallRW-original
          path: original
          run-id: "42607124854"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip curl jq

      - name: Download Smali tools
        run: |
          set -e
          API="https://api.github.com/repos/baksmali/smali/releases/latest"
          RELEASE=$(curl -fsSL "$API")

          B=$(echo "$RELEASE" | jq -r '.assets[] | select(.name=="baksmali-3.0.10-fat-release.jar") | .browser_download_url')
          S=$(echo "$RELEASE" | jq -r '.assets[] | select(.name=="smali-3.0.10-fat-release.jar") | .browser_download_url')

          curl -fL -o baksmali.jar "$B"
          curl -fL -o smali.jar "$S"

      - name: Extract original DEX
        run: |
          unzip -p original/ZallRW.apk classes2.dex > original.dex

      - name: Rebuild DEX
        run: |
          java -Xmx5g -jar baksmali.jar disassemble original.dex -o smali-original
          java -Xmx5g -jar smali.jar assemble smali-original -o rebuilt.dex
          java -Xmx5g -jar baksmali.jar disassemble rebuilt.dex -o smali-rebuilt

      - name: Compare Compose classes
        run: |
          mkdir -p report

          find smali-original smali-rebuilt \
            -type f \( -name '*DrawScope*.smali' -o -name '*BackgroundNode*.smali' \) \
            > report/compose-files.txt

          for f in \
            androidx/compose/ui/graphics/drawscope/DrawScope.smali \
            androidx/compose/foundation/BackgroundNode.smali
          do
            echo "===== $f =====" >> report/compose-diff.txt

            if [ -f "smali-original/$f" ] && [ -f "smali-rebuilt/$f" ]; then
              diff -u "smali-original/$f" "smali-rebuilt/$f" >> report/compose-diff.txt || true
            else
              echo "File tidak ditemukan di salah satu hasil." >> report/compose-diff.txt
            fi
          done

          echo "Pemeriksaan selesai." >> report/compose-diff.txt
          cat report/compose-diff.txt

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-DEX-REPORT
          path: report/
          if-no-files-found: error

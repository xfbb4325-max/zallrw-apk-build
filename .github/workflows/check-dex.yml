name: Check DrawScope Type

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download original APK
        uses: actions/download-artifact@v4
        with:
          name: ZallRW-original
          path: original
          run-id: "42607124854"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Smali tools
        run: |
          set -e
          API="https://api.github.com/repos/baksmali/smali/releases/latest"
          RELEASE=$(curl -fsSL "$API")
          B=$(echo "$RELEASE" | jq -r '.assets[] | select(.name=="baksmali-3.0.10-fat-release.jar") | .browser_download_url')
          S=$(echo "$RELEASE" | jq -r '.assets[] | select(.name=="smali-3.0.10-fat-release.jar") | .browser_download_url')
          test -n "$B"
          test -n "$S"
          curl -fL --retry 3 -o baksmali.jar "$B"
          curl -fL --retry 3 -o smali.jar "$S"

      - name: Extract original DEX files
        run: |
          set -e
          mkdir -p original_dex report
          unzip -j original/ZallRW.apk 'classes*.dex' -d original_dex
          ls -lh original_dex

      - name: Disassemble original classes2.dex
        run: |
          set -e
          java -Xmx5g -jar baksmali.jar disassemble original_dex/classes2.dex -o smali-original
          java -Xmx5g -jar smali.jar assemble smali-original -o rebuilt.dex
          java -Xmx5g -jar baksmali.jar disassemble rebuilt.dex -o smali-rebuilt

      - name: Inspect DrawScope declarations
        run: |
          set -e

          TARGET="androidx/compose/ui/graphics/drawscope/DrawScope.smali"

          {
            echo "=== DEX ASLI ==="
            if [ -f "smali-original/$TARGET" ]; then
              grep -m 1 '^\.class ' "smali-original/$TARGET"
              grep -E 'invoke-(interface|virtual|static|direct)' "smali-original/$TARGET" | head -20 || true
            else
              echo "DrawScope tidak ditemukan"
            fi

            echo
            echo "=== DEX HASIL RAKITAN ==="
            if [ -f "smali-rebuilt/$TARGET" ]; then
              grep -m 1 '^\.class ' "smali-rebuilt/$TARGET"
              grep -E 'invoke-(interface|virtual|static|direct)' "smali-rebuilt/$TARGET" | head -20 || true
            else
              echo "DrawScope tidak ditemukan"
            fi
          } | tee report/drawscope-type.txt

      - name: Search duplicate DrawScope definitions
        run: |
          set -e
          {
            echo "=== DEFINISI DI DEX ASLI ==="
            for f in original_dex/classes*.dex; do
              echo "--- $f"
              java -Xmx5g -jar baksmali.jar disassemble "$f" -o "scan-$(basename "$f" .dex)" >/dev/null 2>&1
              grep -Rl '^\.class .*Landroidx/compose/ui/graphics/drawscope/DrawScope;' "scan-$(basename "$f" .dex)" || true
            done
          } | tee report/duplicate-check.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-DRAWSCOPE-CHECK
          path: report/
          if-no-files-found: warn

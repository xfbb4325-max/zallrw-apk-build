
name: Compare BackgroundNode

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download original APK
        uses: actions/download-artifact@v4
        with:
          name: ZallRW-original
          path: original
          run-id: "42607124854"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Smali tools
        run: |
          set -e
          API="https://api.github.com/repos/baksmali/smali/releases/latest"
          RELEASE=$(curl -fsSL "$API")

          B=$(echo "$RELEASE" | jq -r '.assets[] | select(.name=="baksmali-3.0.10-fat-release.jar") | .browser_download_url')
          S=$(echo "$RELEASE" | jq -r '.assets[] | select(.name=="smali-3.0.10-fat-release.jar") | .browser_download_url')

          test -n "$B"
          test -n "$S"

          curl -fL --retry 3 -o baksmali.jar "$B"
          curl -fL --retry 3 -o smali.jar "$S"

      - name: Extract all DEX files
        run: |
          set -e
          mkdir -p original_dex rebuilt_dex report

          unzip -j original/ZallRW.apk 'classes*.dex' -d original_dex

          ls -lh original_dex

      - name: Disassemble and rebuild all DEX files
        run: |
          set -e

          for dex in original_dex/classes*.dex; do
            name=$(basename "$dex" .dex)

            java -Xmx5g -jar baksmali.jar disassemble "$dex" -o "smali-$name"

            java -Xmx5g -jar smali.jar assemble "smali-$name" -o "rebuilt_dex/$name.dex"

            java -Xmx5g -jar baksmali.jar disassemble "rebuilt_dex/$name.dex" -o "rebuilt-$name"
          done

      - name: Compare BackgroundNode contents
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import difflib

          report = Path("report")
          report.mkdir(exist_ok=True)

          original_files = {}
          rebuilt_files = {}

          for root in Path(".").glob("smali-classes*"):
              for f in root.rglob("*BackgroundNode*.smali"):
                  original_files[str(f.relative_to(root))] = f

          for root in Path(".").glob("rebuilt-classes*"):
              for f in root.rglob("*BackgroundNode*.smali"):
                  rebuilt_files[str(f.relative_to(root))] = f

          names = sorted(set(original_files) | set(rebuilt_files))

          with (report / "backgroundnode-summary.txt").open("w") as summary:
              summary.write(f"Jumlah file asli: {len(original_files)}\n")
              summary.write(f"Jumlah file rakitan: {len(rebuilt_files)}\n")

              if not names:
                  summary.write("BackgroundNode tidak ditemukan.\n")

              for name in names:
                  summary.write(f"\n{name}\n")

                  if name not in original_files:
                      summary.write("Hanya ditemukan di hasil rakitan.\n")
                      continue

                  if name not in rebuilt_files:
                      summary.write("Hanya ditemukan di DEX asli.\n")
                      continue

                  old = original_files[name].read_text(errors="replace").splitlines()
                  new = rebuilt_files[name].read_text(errors="replace").splitlines()

                  diff = list(difflib.unified_diff(
                      old, new,
                      fromfile="original/" + name,
                      tofile="rebuilt/" + name,
                      lineterm=""
                  ))

                  if diff:
                      summary.write("ADA PERBEDAAN ISI.\n")
                      safe_name = name.replace("/", "_").replace("$", "_")
                      (report / (safe_name + ".diff")).write_text(
                          "\n".join(diff) + "\n"
                      )
                  else:
                      summary.write("ISI IDENTIK.\n")

          print((report / "backgroundnode-summary.txt").read_text())
          PY

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-BACKGROUNDNODE-REPORT
          path: report/
          if-no-files-found: warn

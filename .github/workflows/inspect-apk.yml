name: Inspect Zall RW APK

'on':
workflow_dispatch:

permissions:
actions: read
contents: read

jobs:
inspect:
runs-on: ubuntu-latest
steps:
- name: Download original APK
uses: actions/download-artifact@v4
with:
name: ZallRW-original
path: original
run-id: 42607124854
github-token: "${{ github.token }}"

  - name: Install Apktool
    run: sudo apt-get update && sudo apt-get install -y apktool

  - name: Decode APK
    run: apktool d original/ZallRW.apk -o project -f

  - name: Inspect backend URLs
    run: |
      echo "=== BACKEND URLS ==="
      grep -RhoE 'https?://[^" ]+' project --include='*.smali' | sort -u || true
      echo "=== PACKAGE ==="
      grep -n 'package=' project/AndroidManifest.xml
      echo "=== DECODE COMPLETE ==="

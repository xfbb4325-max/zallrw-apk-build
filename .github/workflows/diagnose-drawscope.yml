
name: Diagnose DrawScope All DEX

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Download Original APK
        uses: actions/download-artifact@v4
        with:
          name: ZallRW-original
          path: original
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42607124854

      - name: Download Crashed APK
        uses: actions/download-artifact@v4
        with:
          name: ZallRW-PERMANENT
          path: rebuilt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42722290672

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Baksmali
        run: |
          curl -L -o baksmali.jar \
          https://repo1.maven.org/maven2/org/smali/baksmali/3.0.10/baksmali-3.0.10.jar

      - name: Analyze All DEX
        shell: bash
        run: |
          set -e

          mkdir -p decoded/original decoded/rebuilt

          find original -name '*.apk' -print
          find rebuilt -name '*.apk' -print

          ORIG=$(find original -name '*.apk' | head -n 1)
          NEW=$(find rebuilt -name '*.apk' | head -n 1)

          if [ -z "$ORIG" ] || [ -z "$NEW" ]; then
            echo "APK NOT FOUND" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          mkdir -p apk/original apk/rebuilt
          unzip -oq "$ORIG" -d apk/original
          unzip -oq "$NEW" -d apk/rebuilt

          for TYPE in original rebuilt; do
            for DEX in apk/$TYPE/classes*.dex; do
              [ -f "$DEX" ] || continue
              NAME=$(basename "$DEX" .dex)
              java -jar baksmali.jar disassemble "$DEX" \
                -o "decoded/$TYPE/$NAME"
            done
          done

          {
            echo "# DrawScope Diagnosis - All DEX"
            echo
            echo "## APK files"
            echo "Original: $ORIG"
            echo "Rebuilt: $NEW"
            echo
            echo "## DEX files"
            find apk/original apk/rebuilt -name '*.dex' | sort
            echo
            echo "## BackgroundNode locations"
            find decoded -name 'BackgroundNode.smali'
            echo
            echo "## DrawScope declaration"
            grep -R -n -E '^\.class .*DrawScope' decoded || true
            echo
            echo "## DrawScope drawRect call sites"
            grep -R -n -C 5 'DrawScope;->drawRect' decoded || true
            echo
            echo "## BackgroundNode drawRect instructions"
            find decoded -name 'BackgroundNode.smali' \
              -exec grep -n -C 8 'drawRect' {} \; || true
            echo
            echo "## BackgroundNode draw methods"
            find decoded -name 'BackgroundNode.smali' \
              -exec grep -n -E '^[[:space:]]*\.method.* (draw|drawRect)' {} \; || true
            echo
            echo "## Changed DrawScope-related classes"
            for F in \
              androidx/compose/foundation/BackgroundNode.smali \
              androidx/compose/ui/graphics/drawscope/DrawScope.smali \
              androidx/compose/ui/layout/SubcomposeLayoutKt.smali \
              androidx/compose/ui/node/LayoutNodeKt.smali \
              androidx/compose/ui/text/AndroidTextStyle_androidKt.smali
            do
              echo
              echo "### $F"
              for TYPE in original rebuilt; do
                echo "[$TYPE]"
                find "decoded/$TYPE" -path "*/$F" -print
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finish
        run: echo "Diagnosis completed."
        

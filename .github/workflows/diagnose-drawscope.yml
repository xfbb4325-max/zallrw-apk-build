
name: Diagnose DrawScope All DEX

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Download Original APK
        uses: actions/download-artifact@v4
        with:
          name: ZallRW-original
          path: original
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42607124854

      - name: Download Crashed APK
        uses: actions/download-artifact@v4
        with:
          name: ZallRW-PERMANENT
          path: rebuilt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42722290672

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maven and Baksmali
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
          mkdir -p lib
          cat > pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>diagnose</groupId>
            <artifactId>drawscope</artifactId>
            <version>1.0</version>
            <dependencies>
              <dependency>
                <groupId>org.smali</groupId>
                <artifactId>baksmali</artifactId>
                <version>2.5.2</version>
              </dependency>
            </dependencies>
          </project>
          EOF
          mvn -q dependency:copy-dependencies \
            -DoutputDirectory=lib
          java -cp "lib/*" org.jf.baksmali.Main --version

      - name: Analyze All DEX
        shell: bash
        run: |
          set -e

          mkdir -p apk/original apk/rebuilt
          mkdir -p decoded/original decoded/rebuilt

          ORIG=$(find original -name '*.apk' | head -n 1)
          NEW=$(find rebuilt -name '*.apk' | head -n 1)

          if [ -z "$ORIG" ] || [ -z "$NEW" ]; then
            echo "APK NOT FOUND" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          unzip -oq "$ORIG" -d apk/original
          unzip -oq "$NEW" -d apk/rebuilt

          for TYPE in original rebuilt; do
            for DEX in apk/$TYPE/classes*.dex; do
              [ -f "$DEX" ] || continue
              NAME=$(basename "$DEX" .dex)
              java -cp "lib/*" org.jf.baksmali.Main disassemble \
                "$DEX" -o "decoded/$TYPE/$NAME"
            done
          done

          {
            echo "# DrawScope Diagnosis - All DEX"
            echo
            echo "## APK"
            echo "Original: $ORIG"
            echo "Rebuilt: $NEW"
            echo
            echo "## DEX files"
            find apk/original apk/rebuilt -name '*.dex' | sort
            echo
            echo "## BackgroundNode locations"
            find decoded -name 'BackgroundNode.smali'
            echo
            echo "## DrawScope declarations"
            grep -R -n -E '^\.class .*DrawScope' decoded || true
            echo
            echo "## DrawScope drawRect call sites"
            grep -R -n -C 5 'DrawScope;->drawRect' decoded || true
            echo
            echo "## BackgroundNode drawRect instructions"
            find decoded -name 'BackgroundNode.smali' \
              -exec grep -n -C 8 'drawRect' {} \; || true
            echo
            echo "## BackgroundNode draw methods"
            find decoded -name 'BackgroundNode.smali' \
              -exec grep -n -E '^[[:space:]]*\.method.* (draw|drawRect)' {} \; || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finish
        run: echo "Diagnosis completed."

      - name: Update backend and certificate hash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("smali2")
          old_url = "https://pusat-mlbb.vercel.app"
          new_url = "https://zallrw-vip-backend-63rdvpmns-kedu065-maker.vercel.app"
          old_hash = "NzXW8cqbFRP2WXcG9sOywgAsFT+AISDgqH5gDne81JY="
          new_hash = "6TrA5WmWqHbMEyJxaXQGvWc9tLfuHhOyiF/cr1E0dUc="

          files = list(root.rglob("*.smali"))
          url_count = 0
          hash_count = 0

          for path in files:
              content = path.read_text(errors="replace")

              url_count += content.count(old_url)
              content = content.replace(old_url, new_url)

              if path.as_posix().endswith("/z/c41.smali"):
                  hash_count = content.count(old_hash)
                  if hash_count != 2:
                      raise SystemExit(
                          f"Hash lama ditemukan {hash_count} kali, bukan 2."
                      )
                  content = content.replace(old_hash, new_hash)

              path.write_text(content)

          if url_count == 0:
              raise SystemExit("URL lama tidak ditemukan.")

          check = Path("smali2/z/c41.smali").read_text()
          if old_hash in check:
              raise SystemExit("Hash lama masih ditemukan.")
          if check.count(new_hash) != 2:
              raise SystemExit("Hash baru tidak ditemukan 2 kali.")

          print("URL lama berhasil diganti:", url_count)
          print("Hash sertifikat berhasil diganti: 2 kemunculan.")
          PY

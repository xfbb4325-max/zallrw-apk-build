
name: Final Compose Diagnosis

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Original APK
        uses: actions/download-artifact@v4
        with:
          name: ZallRW-original
          path: original
          run-id: "42607124854"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Crashed APK
        uses: actions/download-artifact@v4
        with:
          name: ZallRW-PERMANENT
          path: crashed
          run-id: "42722290672"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Baksmali
        run: |
          curl -fL -o baksmali.jar \
            https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar

          echo "37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  baksmali.jar" | sha256sum -c -

      - name: Extract Both APKs
        run: |
          set -e

          mkdir -p original/dex crashed/dex

          O=$(find original -maxdepth 1 -iname '*.apk' | head -1)
          C=$(find crashed -maxdepth 1 -iname '*.apk' | head -1)

          test -n "$O"
          test -n "$C"

          unzip -j "$O" 'classes*.dex' -d original/dex
          unzip -j "$C" 'classes*.dex' -d crashed/dex

          for TYPE in original crashed; do
            for DEX in "$TYPE"/dex/classes*.dex; do
              NAME=$(basename "$DEX" .dex)
              java -Xmx5g -jar baksmali.jar disassemble \
                "$DEX" -o "$TYPE/$NAME"
            done
          done

      - name: Analyze DrawScope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib

          report = []

          def out(s=""):
              report.append(s)

          roots = {
              "ASLI": [Path("original/classes"), Path("original/classes2")],
              "CRASH": [Path("crashed/classes"), Path("crashed/classes2")]
          }

          target = "Landroidx/compose/ui/graphics/drawscope/DrawScope;"

          for label, dirs in roots.items():
              out(f"## {label}")

              for root in dirs:
                  if not root.exists():
                      continue

                  matches = []
                  for f in root.rglob("*.smali"):
                      lines = f.read_text(errors="replace").splitlines()
                      for n, line in enumerate(lines, 1):
                          if target in line:
                              matches.append((f, n, line.strip()))

                  out(f"### {root}: {len(matches)} referensi")

                  for f, n, line in matches:
                      if any(x in line for x in (
                          "invoke-virtual",
                          "invoke-interface",
                          "invoke-static",
                          "invoke-direct"
                      )):
                          out(f"- `{f}:{n}` {line}")

          out("\n## CLASS BACKGROUND NODE")

          for label, dirs in roots.items():
              out(f"### {label}")
              found = []

              for root in dirs:
                  if root.exists():
                      found.extend(root.rglob("*BackgroundNode*.smali"))

              if not found:
                  out("Tidak ditemukan.")
              else:
                  for f in found:
                      out(f"- `{f}`")
                      lines = f.read_text(errors="replace").splitlines()
                      for n, line in enumerate(lines):
                          if "DrawScope" in line or "drawRect" in line:
                              out(f"  Baris {n+1}: `{line.strip()}`")

          out("\n## PERBEDAAN CLASS PEMANGGIL")

          for dex in ("classes", "classes2"):
              a = Path(f"original/{dex}")
              b = Path(f"crashed/{dex}")

              if not a.exists() or not b.exists():
                  continue

              old = {
                  str(p.relative_to(a)): p
                  for p in a.rglob("*.smali")
              }
              new = {
                  str(p.relative_to(b)): p
                  for p in b.rglob("*.smali")
              }

              changed = [
                  name for name in old.keys() & new.keys()
                  if old[name].read_bytes() != new[name].read_bytes()
              ]

              out(f"### {dex}: {len(changed)} class berubah")

              for name in changed:
                  if any(x in name for x in (
                      "BackgroundNode", "LayoutNode",
                      "DrawScope", "GraphicsLayer"
                  )):
                      out(f"- `{name}`")

          Path("result.md").write_text("\n".join(report))
          print("\n".join(report))
          PY

      - name: Publish Summary
        if: always()
        run: |
          if [ -f result.md ]; then
            cat result.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pemeriksaan gagal. Lihat log langkah sebelumnya." >> "$GITHUB_STEP_SUMMARY"
          fi

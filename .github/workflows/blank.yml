# CI and source inspection for the Zall RW APK
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore APK source and inspect VIP implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name 'source.part-*' | wc -l)" -eq 19
          cat source.part-{00..18} > source.zip
          unzip -q source.zip -d decoded
          ROOT="decoded/Zall RW_src"
          test -d "$ROOT"
          {
            echo "=== VIP and redeem references ==="
            grep -R -n -I -E 'vipUntil|isVip|VipStatus|vip_until|vip_tier|vip_is_vip|redeemCode|api/device|api/redeem|api/register' "$ROOT/smali"* 2>/dev/null | head -800 || true
          } > vip-inspect.txt
          echo "VIP reference count: $(wc -l < vip-inspect.txt)"
          cat vip-inspect.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZallRW-VIP-implementation-inspection
          path: vip-inspect.txt
          retention-days: 7

name: Build IGNIX APK from decoded source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ignix-apk.yml'

permissions:
  contents: read
  actions: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name 'source.part-*' | wc -l)" -eq 19
          cat source.part-{00..18} > source.zip
          unzip -t source.zip | tail -n 2
          mkdir decoded
          unzip -q source.zip -d decoded
          test -s "decoded/Zall RW_src/AndroidManifest.xml"
          test -s "decoded/Zall RW_src/apktool.json"
          echo "Decoded APK tree restored."

      - name: Install Apktool 3.0.3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml curl librsvg2-bin
          sudo curl -fL --retry 3 \
            https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_3.0.3.jar \
            -o /usr/local/lib/apktool.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  /usr/local/lib/apktool.jar" | sha256sum -c -
          printf '#!/usr/bin/env bash\nexec java -jar /usr/local/lib/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Convert source metadata and rebuild
        shell: bash
        run: |
          set -euo pipefail
          cd "decoded/Zall RW_src"
          python3 - <<'PY'
          import json, re, yaml

          def normalize(value):
              if isinstance(value, dict):
                  return {k: normalize(v) for k, v in value.items()}
              if isinstance(value, list):
                  return [normalize(v) for v in value]
              if isinstance(value, str):
                  match = re.fullmatch(r"'(-?\\d+)'", value)
                  if match:
                      return int(match.group(1))
                  if len(value) >= 2 and value[0] == "'" and value[-1] == "'":
                      return value[1:-1]
              return value

          with open("apktool.json", encoding="utf-8") as f:
              src = normalize(json.load(f))
          out = {
              "version": "3.0.3",
              "apkFileName": src.get("apkFileName", "ZallRW.apk"),
              "isFrameworkApk": src.get("isFrameworkApk", False),
              "usesFramework": src.get("UsesFramework", {"ids": [1], "tag": None}),
              "sdkInfo": src.get("sdkInfo", {}),
              "packageInfo": src.get("PackageInfo", {}),
              "versionInfo": {**src.get("VersionInfo", {}), "versionCode": int(str(src.get("VersionInfo", {}).get("versionCode", "19")).strip("\\'\""))},
              "compressionType": src.get("compressionType", False),
              "sparseResources": src.get("sparseResources", False),
              "sharedLibrary": src.get("sharedLibrary", False),
              "doNotCompress": src.get("doNotCompress", []),
              "unknownFiles": src.get("unknownFiles", {}),
          }
          with open("apktool.yml", "w", encoding="utf-8") as f:
              yaml.safe_dump(out, f, sort_keys=False, allow_unicode=True)
          PY
          cd ../..
          python3 - <<'PY'
          from pathlib import Path
          root = Path("decoded/Zall RW_src")
          import shutil
          for density in ("mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"):
              for icon_name in ("ic_launcher.png", "ic_launcher_round.png"):
                  target = root / f"res/mipmap-{density}/{icon_name}"
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(f"/tmp/ignix-icons/{density}.png", target)
          shutil.copyfile("/tmp/ignix-icons/splash.png", root / "res/drawable/splash_icon.png")
          junk = {"interfaces", "virtual methods"}
          fixed = []
          for path in root.rglob("*.smali"):
              try:
                  source = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              lines = source.splitlines(keepends=True)
              kept = [line for line in lines if line.strip() not in junk]
              if len(kept) != len(lines):
                  path.write_text("".join(kept), encoding="utf-8")
                  fixed.append(str(path))
          print(f"Removed invalid decompiler headings from {len(fixed)} Smali file(s): {fixed}")
          PY

      - name: Generate IGNIX phoenix launcher icon
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ignix.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <defs><radialGradient id="b"><stop stop-color="#351014"/><stop offset="1" stop-color="#08090d"/></radialGradient><linearGradient id="f" x2=".8" y2="1"><stop stop-color="#ff7048"/><stop offset=".45" stop-color="#ed1728"/><stop offset="1" stop-color="#650817"/></linearGradient><linearGradient id="s"><stop stop-color="#fff"/><stop offset="1" stop-color="#68717f"/></linearGradient></defs>
            <rect width="512" height="512" rx="112" fill="url(#b)"/>
            <path d="M256 42 292 145 380 78 345 185 462 151 365 239 455 304 340 295 399 430 282 354 256 474 230 354 113 430 172 295 57 304 147 239 50 151 167 185 132 78 220 145Z" fill="url(#f)" stroke="#ff5544" stroke-width="7" stroke-linejoin="round"/>
            <path d="M256 126c-19 42-58 66-88 94 32-7 57-2 79 12-38 15-61 47-70 84 30-19 56-23 79-15-24 36-27 75 0 122 27-47 24-86 0-122 23-8 49-4 79 15-9-37-32-69-70-84 22-14 47-19 79-12-30-28-69-52-88-94Z" fill="#090a0e" stroke="url(#s)" stroke-width="9" stroke-linejoin="round"/>
            <path d="M179 238 92 201 155 276 208 267M333 238 420 201 357 276 304 267" fill="none" stroke="url(#s)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M236 306 256 276 276 306" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
          </svg>
          SVG
          mkdir -p /tmp/ignix-icons
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density=${spec%%:*}; size=${spec##*:}
            rsvg-convert -w "$size" -h "$size" /tmp/ignix.svg > "/tmp/ignix-icons/$density.png"
          done
          rsvg-convert -w 512 -h 512 /tmp/ignix.svg > /tmp/ignix-icons/splash.png
      - name: Apply IGNIX brand identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("decoded/Zall RW_src")
          strings = root / "res/values/strings.xml"
          data = strings.read_text(encoding="utf-8")
          old = '<string name="app_name">Zall RW</string>'
          new = '<string name="app_name">IGNIX</string>'
          if old not in data:
              raise SystemExit("Expected app_name string was not found")
          strings.write_text(data.replace(old, new, 1), encoding="utf-8")
          replacements = {
              "smali_classes2/com/zallrwv4/app/service/FloatingWindowService.smali": {
                  '"Zall RW"': '"IGNIX"',
                  '"Zall RW overlay aktif"': '"IGNIX overlay aktif"',
              },
              "smali_classes2/com/zallrwv4/app/vpn/FakeVpnService.smali": {
                  '"Status koneksi VPN Zall RW"': '"Status koneksi VPN IGNIX"',
                  '"Zall RW \\u00b7 "': '"IGNIX \\u00b7 "',
              },
              "smali_classes2/com/zallrwv4/app/worker/UpdateCheckWorker.smali": {
                  '"Notifikasi update versi Zall RW"': '"Notifikasi update versi IGNIX"',
                  '"Segera update aplikasi Zall RW untuk melanjutkan penggunaan."': '"Segera update aplikasi IGNIX untuk melanjutkan penggunaan."',
                  '"Versi baru Zall RW sudah tersedia. Tap untuk update."': '"Versi baru IGNIX sudah tersedia. Tap untuk update."',
              },
          }
          for relative, pairs in replacements.items():
              path = root / relative
              text = path.read_text(encoding="utf-8")
              for before, after in pairs.items():
                  text = text.replace(before, after)
              path.write_text(text, encoding="utf-8")
          print("IGNIX app label and system notification branding applied.")
          PY

      - name: Remove Settings from bottom navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("decoded/Zall RW_src/smali/z/au.smali")
          s = p.read_text(encoding="utf-8")
          old = "    filled-new-array {v6, v8, v10}, [Lz/wn0;\n"
          new = "    filled-new-array {v6, v8}, [Lz/wn0;\n"
          if s.count(old) != 1:
              raise SystemExit("Expected one 3-item bottom navigation list; refusing unsafe patch")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          check = p.read_text(encoding="utf-8")
          if old in check or new not in check:
              raise SystemExit("Settings navigation verification failed")
          print("Verified bottom navigation contains Home and Profile only.")
          PY
      - name: Apply IGNIX dark red theme
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("decoded/Zall RW_src/smali_classes2/com/zallrwv4/app/MainActivity.smali")
          s = p.read_text(encoding="utf-8")
          call = "    invoke-static/range {v4 .. v9}, Lz/rd1;->a(ZZILz/s70;Landroidx/compose/runtime/Composer;I)V"
          if s.count(call) != 1:
              raise SystemExit("Theme call mismatch; refusing unsafe patch")
          patch = """    # IGNIX dark appearance and red accent
              const/4 v4, 0x1
              const/4 v5, 0x0
              const v6, -0x1ac6cb
          """
          p.write_text(s.replace(call, patch + call, 1), encoding="utf-8")
          print("Applied IGNIX dark/red Material theme; application feature logic untouched.")
          PY

      - name: Point APK to new Zall RW backend
        shell: bash
        run: |
          set -euo pipefail
          OLD='https://zallrw-vip-backend-63rdvpmns-kedu065-maker.vercel.app'
          NEW='https://nvxgpmbakbzjyfjstdwl.supabase.co/functions/v1/zallrw-api-v2'
          python3 - <<'PY'
          from pathlib import Path
          old = "https://zallrw-vip-backend-63rdvpmns-kedu065-maker.vercel.app"
          new = "https://nvxgpmbakbzjyfjstdwl.supabase.co/functions/v1/zallrw-api-v2"
          root = Path("decoded/Zall RW_src")
          hits = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  data = path.read_bytes()
                  old_b = old.encode()
                  if old_b in data:
                      count = data.count(old_b)
                      path.write_bytes(data.replace(old_b, new.encode()))
                      hits.append((str(path), count))
              except (OSError, PermissionError):
                  continue
          total = sum(count for _, count in hits)
          print("Patched backend URL occurrences:", total)
          for path, count in hits:
              print(f"{path}: {count}")
          if total == 0:
              raise SystemExit("STOP: old backend URL not found; APK was not rebuilt with an unverified change.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          old_host = "zallrw-vip-backend-63rdvpmns-kedu065-maker.vercel.app"
          new_host = "nvxgpmbakbzjyfjstdwl.supabase.co"
          root = Path("decoded/Zall RW_src")
          changed = 0
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  data = path.read_bytes()
                  if old_host.encode() in data:
                      count = data.count(old_host.encode())
                      path.write_bytes(data.replace(old_host.encode(), new_host.encode()))
                      changed += count
              except OSError:
                  continue
          print("Patched Android network-security hostname references:", changed)
          PY
          if grep -R -a -n 'zallrw-vip-backend-63rdvpmns-kedu065-maker.vercel.app' 'decoded/Zall RW_src'; then
            echo "ERROR: old backend hostname remains in source"
            exit 1
          fi
          curl --fail --silent --show-error "$NEW/health"

          # Generate the signing key first, then pin the app's built-in certificate check
          # to this exact build certificate. Keep the anti-debug and runtime integrity checks intact.
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          CERT_HASH="$(keytool -exportcert -keystore debug.keystore -storepass android -alias androiddebugkey | openssl dgst -sha256 -binary | base64 -w0)"
          export CERT_HASH
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("decoded/Zall RW_src/smali_classes2/z/c41.smali")
          s = p.read_text(encoding="utf-8")
          old = 'NzXW8cqbFRP2WXcG9sOywgAsFT+AISDgqH5gDne81JY='
          new = os.environ["CERT_HASH"]
          if old not in s:
              raise SystemExit("Expected signing certificate pin not found in c41.smali")
          p.write_text(s.replace(old, new), encoding="utf-8")
          print("Updated built-in certificate pin for this APK signing key:", new)
          PY
          export JAVA_TOOL_OPTIONS="-Xmx6g -XX:+UseG1GC"
          apktool b "decoded/Zall RW_src" -o unsigned.apk
          test -s unsigned.apk
          # Apktool omits Java ServiceLoader descriptors from META-INF. Restore the
          # coroutine Android dispatcher providers so Dispatchers.Main can initialize.
          mkdir -p service-descriptors/META-INF/services
          cp "decoded/Zall RW_src/META-INF/services/"* service-descriptors/META-INF/services/
          (cd service-descriptors && zip -q -r ../unsigned.apk META-INF/services)
          unzip -l unsigned.apk | grep 'META-INF/services/kotlinx.coroutines.internal.MainDispatcherFactory'
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/zipalign" -f 4 unsigned.apk aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out ZallRW-rebuilt.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose ZallRW-rebuilt.apk
          sha256sum ZallRW-rebuilt.apk

      - name: Test installation and collect startup diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 6144 -cores 4
          script: |
            set -u
            mkdir -p diagnostics
            adb wait-for-device
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            # Avoid slow incremental installation and grant the app's declared runtime
            # permissions before launch so the permission controller cannot obscure startup.
            adb install --no-incremental -r ZallRW-rebuilt.apk 2>&1 | tee diagnostics/install.txt
            adb shell pm grant com.zallrwv4.app android.permission.READ_EXTERNAL_STORAGE || true
            adb shell pm grant com.zallrwv4.app android.permission.WRITE_EXTERNAL_STORAGE || true
            adb shell pm grant com.zallrwv4.app android.permission.POST_NOTIFICATIONS || true
            adb shell appops set com.zallrwv4.app MANAGE_EXTERNAL_STORAGE allow || true
            adb shell appops set com.zallrwv4.app SYSTEM_ALERT_WINDOW allow || true
            adb logcat -c
            adb shell monkey -p com.zallrwv4.app 1 2>&1 | tee diagnostics/launch.txt
            # The obfuscated app performs substantial first-run dex verification on
            # the emulator; allow it to finish before deciding startup has failed.
            sleep 120
            adb shell dumpsys activity lastanr > diagnostics/lastanr.txt 2>&1 || true
            adb shell dumpsys meminfo com.zallrwv4.app > diagnostics/meminfo.txt 2>&1 || true
            adb shell dumpsys activity top > diagnostics/activity-top.txt 2>&1 || true
            adb shell ps -A -o USER,PID,PPID,STAT,NAME > diagnostics/processes.txt 2>&1 || true
            adb shell dumpsys activity activities > diagnostics/activities.txt
            adb shell dumpsys window windows > diagnostics/windows.txt
            adb shell pidof com.zallrwv4.app > diagnostics/pid.txt || true
            adb logcat -d -v threadtime > diagnostics/logcat.txt
            adb exec-out screencap -p > diagnostics/startup.png || true
            if ! grep -q 'com.zallrwv4.app/.MainActivity' diagnostics/activities.txt; then
              echo "FAIL: MainActivity is not present in the resumed activity dump"
              exit 1
            fi
            if [ ! -s diagnostics/pid.txt ]; then
              echo "FAIL: app process is not alive after launch"
              exit 1
            fi
            if grep -q 'FATAL EXCEPTION' diagnostics/logcat.txt; then
              echo "FAIL: Android reported a fatal exception"
              exit 1
            fi
            echo "PASS: IGNIX MainActivity stayed alive without a fatal exception."
            echo "Startup diagnostics collected."

      - name: Upload rebuilt APK
        uses: actions/upload-artifact@v4
        with:
          name: IGNIX-installable-APK
          path: ZallRW-rebuilt.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IGNIX-startup-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

name: IGNIX APK Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ignix-apk.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source archive
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name 'source.part-*' | wc -l)" -eq 19
          echo "All 19 source archive parts are present."

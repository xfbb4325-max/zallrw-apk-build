name: Download Zall RW APK

'on':
workflow_dispatch:

jobs:
download:
runs-on: ubuntu-latest
steps:
- name: Download APK
run: |
pip install gdown
gdown --fuzzy "https://drive.google.com/file/d/1lnhexImqC_QN4pobsE2idUYlszTsPQQu/view" -O ZallRW.apk
test -s ZallRW.apk

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: ZallRW-original
      path: ZallRW.apk

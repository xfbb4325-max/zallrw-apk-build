name: Test MediaFire Download

'on':
workflow_dispatch:

jobs:
download:
runs-on: ubuntu-latest
steps:
- name: Test MediaFire
run: |
python - <<'PY'
import requests
from bs4 import BeautifulSoup

      url = "https://www.mediafire.com/file/0o7ec6br9f60wi7/Zall+RW.apk/file"
      r = requests.get(url, timeout=60)
      print("HTTP:", r.status_code)
      print("Final URL:", r.url)
      print("Page title:", BeautifulSoup(r.text, "html.parser").title)
      print("APK link ditemukan:", "download" in r.text.lower())
      PY

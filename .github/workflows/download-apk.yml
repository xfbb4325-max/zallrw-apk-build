name: Test MediaFire

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check MediaFire
        run: python -c "import requests; u='https://www.mediafire.com/file/0o7ec6br9f60wi7/Zall+RW.apk/file'; r=requests.get(u,timeout=60); print('HTTP:',r.status_code); print('URL:',r.url); print('Title:',r.text[:500])"

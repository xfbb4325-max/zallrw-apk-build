name: Download Zall RW APK

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Get APK from MediaFire
        run: |
          pip install requests beautifulsoup4
          python -c "import requests; from bs4 import BeautifulSoup; u='https://www.mediafire.com/file/0o7ec6br9f60wi7/Zall+RW.apk/file'; s=BeautifulSoup(requests.get(u).text,'html.parser'); a=s.select_one('#downloadButton'); print('Download button:',a); assert a and a.get('href'), 'Direct download link not found'; r=requests.get(a['href'],stream=True); r.raise_for_status(); f=open('ZallRW.apk','wb'); [f.write(x) for x in r.iter_content(1024*1024)]; f.close(); print('Downloaded:',r.headers.get('Content-Type'))"
          file ZallRW.apk
          test "$(head -c 2 ZallRW.apk)" = "PK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-original
          path: ZallRW.apk

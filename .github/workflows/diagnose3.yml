name: Diagnose Zall RW - Certificate

'on':
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Download original APK
        uses: actions/download-artifact@v4
        with:
          name: ZallRW-original
          path: original
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42607124854

      - name: Download patched APK
        uses: actions/download-artifact@v4
        with:
          name: ZallRW-PATCHED
          path: patched
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42658587420

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip curl jq

      - name: Download Smali
        run: |
          set -e
          API=$(curl -fsSL https://api.github.com/repos/baksmali/smali/releases/latest)
          B=$(echo "$API" | jq -r '.assets[] | select(.name | test("^baksmali-.*-fat-release\\.jar$")) | .browser_download_url' | head -n 1)
          curl -fL "$B" -o baksmali.jar

      - name: Extract and disassemble
        run: |
          set -e
          O=$(find original -name '*.apk' | head -n 1)
          P=$(find patched -name '*.apk' | head -n 1)

          mkdir original_apk patched_apk
          unzip -q "$O" -d original_apk
          unzip -q "$P" -d patched_apk

          java -jar baksmali.jar disassemble original_apk/classes2.dex -o original_smali
          java -jar baksmali.jar disassemble patched_apk/classes2.dex -o patched_smali

      - name: Compare certificate code
        run: |
          set -e

          {
            echo "===== ORIGINAL c41.smali ====="
            cat original_smali/z/c41.smali

            echo
            echo "===== PATCHED c41.smali ====="
            cat patched_smali/z/c41.smali

            echo
            echo "===== DIFFERENCES ====="
            diff -u original_smali/z/c41.smali patched_smali/z/c41.smali || true

          } > certificate-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-CERTIFICATE-REPORT
          path: certificate-report.txt
          if-no-files-found: error

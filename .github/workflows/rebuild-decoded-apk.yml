name: Rebuild Zall RW APK from decoded source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebuild-decoded-apk.yml'

permissions:
  contents: read
  actions: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name 'source.part-*' | wc -l)" -eq 19
          cat source.part-{00..18} > source.zip
          unzip -t source.zip | tail -n 2
          mkdir decoded
          unzip -q source.zip -d decoded
          test -s "decoded/Zall RW_src/AndroidManifest.xml"
          test -s "decoded/Zall RW_src/apktool.json"
          echo "Decoded APK tree restored."

      - name: Install apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Rebuild and sign APK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          apktool b "decoded/Zall RW_src" -o unsigned.apk
          test -s unsigned.apk
          "$BUILD_TOOLS/zipalign" -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out ZallRW-rebuilt.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose ZallRW-rebuilt.apk
          sha256sum ZallRW-rebuilt.apk

      - name: Test installation and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -e
            adb install -r ZallRW-rebuilt.apk
            adb shell monkey -p com.zallrwv4.app 1
            sleep 20
            adb shell pidof com.zallrwv4.app

      - name: Upload rebuilt APK
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-rebuilt-debug
          path: ZallRW-rebuilt.apk
          if-no-files-found: error
          retention-days: 7

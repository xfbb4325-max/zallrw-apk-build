name: Build Zall RW APK

'on':
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download original APK
        uses: actions/download-artifact@v4
        with:
          name: ZallRW-original
          path: original
          run-id: "42607124854"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Java and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk apksigner curl
          java -version

      - name: Install Apktool 3.0.3
        run: |
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar --version

      - name: Decode APK
        env:
          JAVA_TOOL_OPTIONS: "-Xmx5g"
        run: |
          java -jar apktool.jar d original/ZallRW.apk -o project -f

      - name: Replace backend URLs
        run: |
          find project -name '*.smali' -type f -exec sed -i 's|https://pusat-mlbb.vercel.app|https://zallrw-vip-backend-63rdvpmns-kedu065-maker.vercel.app|g' {} +

      - name: Verify replacement
        run: |
          if grep -R 'pusat-mlbb.vercel.app' project --include='*.smali'; then
            exit 1
          fi
          echo "Backend URL berhasil diganti"

      - name: Build APK
        env:
          JAVA_TOOL_OPTIONS: "-Xmx5g"
        run: |
          java -jar apktool.jar b project -o ZallRW-unsigned.apk

      - name: Create signing key
        run: |
          keytool -genkeypair -keystore zallrw.keystore -alias zallrw -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=Zall RW, O=Zall RW, C=ID"

      - name: Sign APK
        run: |
          apksigner sign --ks zallrw.keystore --ks-key-alias zallrw --ks-pass pass:android123 --key-pass pass:android123 --out ZallRW-VIP.apk ZallRW-unsigned.apk
          apksigner verify ZallRW-VIP.apk

      - name: Upload finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-VIP
          path: ZallRW-VIP.apk

name: Patch Zall RW APK

'on':
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Download original APK
        uses: actions/download-artifact@v4
        with:
          name: ZallRW-original
          path: original
          run-id: "42607124854"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip apksigner curl

      - name: Download Smali tools
        run: |
          curl -L -o baksmali.jar https://github.com/baksmali/smali/releases/download/v3.0.10/baksmali-3.0.10-fat-release.jar
          curl -L -o smali.jar https://github.com/baksmali/smali/releases/download/v3.0.10/smali-3.0.10-fat-release.jar

      - name: Extract classes2.dex
        run: |
          cd original
          unzip -o ZallRW.apk classes2.dex
          test -s classes2.dex
          cp classes2.dex ../classes2.dex

      - name: Disassemble classes2.dex
        run: |
          java -Xmx5g -jar baksmali.jar disassemble classes2.dex -o smali2

      - name: Replace backend
        run: |
          find smali2 -name '*.smali' -exec sed -i 's|https://pusat-mlbb.vercel.app|https://zallrw-vip-backend-63rdvpmns-kedu065-maker.vercel.app|g' {} +

          if grep -R 'pusat-mlbb.vercel.app' smali2; then
            echo "URL lama masih ditemukan"
            exit 1
          fi

      - name: Assemble classes2.dex
        run: |
          java -Xmx5g -jar smali.jar assemble smali2 -o classes2.dex

      - name: Update original APK
        run: |
          cp original/ZallRW.apk ZallRW-patched-unsigned.apk
          zip -d ZallRW-patched-unsigned.apk 'META-INF/*' || true
          zip -u ZallRW-patched-unsigned.apk classes2.dex
          unzip -p ZallRW-patched-unsigned.apk classes2.dex > verify.dex
          cmp classes2.dex verify.dex

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -keystore zallrw.keystore \
            -alias zallrw \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Zall RW, O=Zall RW, C=ID"

      - name: Sign APK
        run: |
          apksigner sign \
            --ks zallrw.keystore \
            --ks-key-alias zallrw \
            --ks-pass pass:android123 \
            --key-pass pass:android123 \
            --out ZallRW-VIP.apk \
            ZallRW-patched-unsigned.apk

          apksigner verify --verbose ZallRW-VIP.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-PATCHED
          path: ZallRW-VIP.apk

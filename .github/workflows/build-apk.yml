name: Build Zall RW APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source parts
        run: |
          set -e
          for i in $(seq -w 0 18); do
            test -f "source.part-$i" || {
              echo "File source.part-$i tidak ditemukan"
              exit 1
            }
          done

      - name: Combine source parts
        run: |
          cat source.part-{00..18} > source.zip
          unzip -t source.zip

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Extract source
        run: |
          mkdir project
          unzip source.zip -d project
          find project -name apktool.yml

      - name: Build APK
        run: |
          DIR=$(find project -name apktool.yml -printf '%h\n' | head -1)
          test -n "$DIR"
          apktool b "$DIR" -o ZallRW-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-unsigned
          path: ZallRW-unsigned.apk
          if-no-files-found: error
